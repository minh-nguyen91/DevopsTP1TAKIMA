services:
    backend:
        build: ./Backend/simple-api
        image: tp1-simple-api
        environment:
            DB_HOST: database
            DB_NAME: ${POSTGRES_DB}
            DB_USER: ${POSTGRES_USER}
            DB_PASSWORD: ${POSTGRES_PASSWORD}
        networks:
            - backend-network
            - frontend-network
        depends_on:
            database:
                condition: service_healthy
        restart: unless-stopped

    database:
        build: ./Database
        image: tp1-database
        environment:
            POSTGRES_DB: ${POSTGRES_DB}
            POSTGRES_USER: ${POSTGRES_USER}
            POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
        volumes:
            - db-data:/var/lib/postgresql/data
        networks:
            - backend-network
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
            interval: 5s
            timeout: 5s
            retries: 10
        restart: unless-stopped

    httpd:
        build: ./HttpServer
        image: tp1-httpd
        environment:
            BACKEND_HOST: ${BACKEND_HOST}
            BACKEND_PORT: ${BACKEND_PORT}
        ports:
            - "${HTTP_PORT}:80"
        networks:
            - frontend-network
        depends_on:
            - backend
        restart: unless-stopped

networks:
    backend-network:
    frontend-network:

volumes:
    db-data:
